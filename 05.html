<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>05. Memory Match</title>
    <style>
        body { background: #0f172a; color: #38bdf8; text-align: center; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center; margin-top: 20px; }
        .card { width: 70px; height: 70px; background: #1e293b; border: 2px solid #38bdf8; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        a { color: #fff; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>05. MEMORY MATCH</h1>
    <div class="grid" id="grid"></div>
    <a href="index.html">⬅ 메인으로 돌아가기</a>
    <script>
        const icons = ['🍄', '🍄', '⭐', '⭐', '🔥', '🔥', '💎', '💎'].sort(() => Math.random() - 0.5);
        let selected = [];
        const grid = document.getElementById("grid");
        icons.forEach((icon, idx) => {
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.icon = icon;
            card.onclick = () => {
                if (selected.length < 2 && !card.innerText) {
                    card.innerText = icon;
                    selected.push(card);
                    if (selected.length === 2) {
                        setTimeout(() => {
                            if (selected[0].dataset.icon !== selected[1].dataset.icon) {
                                selected[0].innerText = ''; selected[1].innerText = '';
                            }
                            selected = [];
                        }, 600);
                    }
                }
            };
            grid.appendChild(card);
        });
    </script>
</body>
</html>
