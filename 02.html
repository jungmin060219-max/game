<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>02. Snake</title>
    <style>
        body { background: #051907; color: #00ff66; text-align: center; font-family: monospace; }
        canvas { background: #000; border: 3px solid #00ff66; margin-top: 20px; }
        a { color: #fff; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>02. RETRO SNAKE</h1>
    <p>방향키로 뱀을 조종하세요!</p>
    <canvas id="game" width="400" height="400"></canvas><br>
    <a href="index.html">⬅ 메인으로 돌아가기</a>
    <script>
        const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
        let snake = [{x: 200, y: 200}], food = {x: 100, y: 100}, dx = 20, dy = 0;
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" && dx === 0) { dx = -20; dy = 0; }
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -20; }
            if (e.key === "ArrowRight" && dx === 0) { dx = 20; dy = 0; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 20; }
        });
        function loop() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) head = {x: 200, y: 200};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20};
            } else snake.pop();
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,400,400);
            ctx.fillStyle = "#ff0055"; ctx.fillRect(food.x, food.y, 18, 18);
            ctx.fillStyle = "#00ff66"; snake.forEach(s => ctx.fillRect(s.x, s.y, 18, 18));
        }
        setInterval(loop, 100);
    </script>
</body>
</html>
