<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Arcade - 8Bit Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f23;
            color: #fff;
            font-family: 'Press Start 2P', cursive, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .thumbnail-container {
            border: 4px solid #ffcc00;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px #ffcc00;
            margin-bottom: 30px;
            background: #000;
        }
        .thumbnail-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        h1 {
            color: #ff3366;
            text-shadow: 3px 3px #000, -2px -2px #00ffff;
            font-size: 22px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #1b1b3a;
            border: 3px solid #00ffcc;
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px #00ffcc;
            background: #282858;
        }
        .game-card .icon {
            font-size: 36px;
            margin-bottom: 15px;
        }
        .game-card .num {
            font-size: 10px;
            color: #ffcc00;
            margin-bottom: 8px;
        }
        .game-card .title {
            font-size: 12px;
            line-height: 1.4;
            color: #ffffff;
        }
        .play-btn {
            margin-top: 15px;
            font-size: 8px;
            background: #ff3366;
            padding: 8px 12px;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- AI 레트로 썸네일 이미지 -->
        <div class="thumbnail-container">
            <img src="thumbnail.png" alt="My Retro Game Arcade Header">
        </div>

        <h1>SELECT YOUR GAME</h1>

        <!-- 6개 게임 카드 목록 -->
        <div class="game-grid">
            <a href="01.html" class="game-card">
                <div>
                    <div class="num">GAME 01</div>
                    <div class="icon">🏓</div>
                    <div class="title">PING PONG</div>
                </div>
                <div class="play-btn">PRESS START</div>
            </a>
            <a href="02.html" class="game-card">
                <div>
                    <div class="num">GAME 02</div>
                    <div class="icon">🐍</div>
                    <div class="title">SNAKE RETRO</div>
                </div>
                <div class="play-btn">PRESS START</div>
            </a>
            <a href="03.html" class="game-card">
                <div>
                    <div class="num">GAME 03</div>
                    <div class="icon">🧱</div>
                    <div class="title">BRICK BREAKER</div>
                </div>
                <div class="play-btn">PRESS START</div>
            </a>
            <a href="04.html" class="game-card">
                <div>
                    <div class="num">GAME 04</div>
                    <div class="icon">🏃</div>
                    <div class="title">RETRO RUNNER</div>
                </div>
                <div class="play-btn">PRESS START</div>
            </a>
            <a href="05.html" class="game-card">
                <div>
                    <div class="num">GAME 05</div>
                    <div class="icon">🧠</div>
                    <div class="title">MEMORY MATCH</div>
                </div>
                <div class="play-btn">PRESS START</div>
            </a>
            <a href="06.html" class="game-card">
                <div>
                    <div class="num">GAME 06</div>
                    <div class="icon">❌</div>
                    <div class="title">TIC TAC TOE</div>
                </div>
                <div class="play-btn">PRESS START</div>
            </a>
        </div>
    </div>
</body>
</html>
