<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>03. Brick Breaker</title>
    <style>
        body { background: #20002c; color: #ff007f; text-align: center; font-family: sans-serif; }
        canvas { background: #100018; border: 3px solid #ff007f; margin-top: 20px; }
        a { color: #fff; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>03. BRICK BREAKER</h1>
    <canvas id="game" width="480" height="320"></canvas><br>
    <a href="index.html">⬅ 메인으로 돌아가기</a>
    <script>
        const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
        let x = 240, y = 250, dx = 3, dy = -3, paddleX = 200;
        let bricks = [];
        for(let c=0; c<5; c++) { bricks[c] = []; for(let r=0; r<3; r++) bricks[c][r] = { x: 0, y: 0, status: 1 }; }
        document.addEventListener("mousemove", e => paddleX = e.clientX - canvas.offsetLeft - 37);
        function draw() {
            ctx.clearRect(0,0,480,320);
            for(let c=0; c<5; c++) for(let r=0; r<3; r++) if(bricks[c][r].status == 1) {
                let bx = (c*85)+25, by = (r*30)+30;
                bricks[c][r].x = bx; bricks[c][r].y = by;
                ctx.fillStyle = "#ff007f"; ctx.fillRect(bx, by, 75, 20);
                if(x > bx && x < bx+75 && y > by && y < by+20) { dy = -dy; bricks[c][r].status = 0; }
            }
            if(x + dx > 470 || x + dx < 10) dx = -dx;
            if(y + dy < 10) dy = -dy;
            else if(y + dy > 300) {
                if(x > paddleX && x < paddleX + 75) dy = -dy;
                else { x = 240; y = 250; dy = -3; }
            }
            x += dx; y += dy;
            ctx.fillStyle = "#00ffff"; ctx.fillRect(paddleX, 305, 75, 10);
            ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fillStyle = "#fff"; ctx.fill();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
