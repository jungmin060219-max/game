<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>01. Ping Pong</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background: #111; border: 3px solid #fff; margin-top: 20px; }
        a { color: #00ffcc; text-decoration: none; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>01. PING PONG</h1>
    <canvas id="game" width="600" height="400"></canvas><br>
    <a href="index.html">⬅ 메인으로 돌아가기</a>
    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        let paddleY = 160, ballX = 300, ballY = 200, dx = 4, dy = 3;
        canvas.addEventListener("mousemove", e => paddleY = e.clientY - canvas.offsetTop - 40);
        function update() {
            ballX += dx; ballY += dy;
            if (ballY <= 0 || ballY >= 400) dy = -dy;
            if (ballX <= 20 && ballY >= paddleY && ballY <= paddleY + 80) dx = -dx;
            if (ballX >= 580) dx = -dx;
            if (ballX < 0) { ballX = 300; ballY = 200; }
            ctx.clearRect(0,0,600,400);
            ctx.fillStyle = "#fff";
            ctx.fillRect(10, paddleY, 10, 80);
            ctx.beginPath(); ctx.arc(ballX, ballY, 8, 0, Math.PI*2); ctx.fill();
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
